<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050d17">
  <title>冰晶回旋</title>
  <script>
    // 个性设置 · 改完这三项，保存文件并刷新浏览器即可。
    const SETTINGS = {
      color: "#9CDEFF",         // 主光颜色，使用六位十六进制色值
      particleCount: 3750,        // 树身粒子数，范围 400 到 4800
      greeting: "愿星光为你停留" // 祝福语，留空即可隐藏
    };
  </script>
  <style>
    :root { color-scheme: dark; background: #050d17; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body, main { width: 100%; height: 100%; margin: 0; }
    main { position: relative; overflow: hidden; isolation: isolate; }
    canvas, #surface { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; pointer-events: none; }
    button { -webkit-tap-highlight-color: transparent; color: inherit; font: inherit; }
    #surface {
      border: 0; margin: 0; padding: 0; background: transparent; appearance: none;
      touch-action: pan-y pinch-zoom; cursor: grab; -webkit-user-select: none; user-select: none;
    }
    #surface.is-dragging { cursor: grabbing; }
    #surface:focus-visible { outline: 2px solid var(--ink, ivory); outline-offset: -6px; }
    #greeting {
      position: absolute; left: 50%; top: 85%; margin: 0; width: max-content; max-width: 88%;
      transform: translate(-50%, -50%); pointer-events: none; text-align: center;
      color: var(--ink, ivory); font-family: "Baskervville", "Iowan Old Style", "Palatino Linotype",
        "Songti SC", "Noto Serif CJK SC", SimSun, Georgia, serif;
      font-size: clamp(1.125rem, 2.8vmin, 1.75rem); font-weight: 400; line-height: 1.5;
      letter-spacing: .13em; overflow-wrap: anywhere; text-wrap: balance;
      text-shadow: 0 0 18px var(--haze, transparent);
    }
    .tools {
      position: absolute; top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right)); display: flex; gap: 4px;
      opacity: 0; pointer-events: none; transition: opacity 300ms cubic-bezier(.22,1,.36,1);
    }
    main.awake .tools, .tools:has(button:focus-visible) { opacity: 1; pointer-events: auto; }
    .tools button {
      display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid transparent;
      border-radius: 50%; background: transparent; color: var(--ink, ivory); cursor: pointer;
      opacity: .8;
    }
    .tools button:hover, .tools button:focus-visible { background: #ffffff12; opacity: 1; }
    .tools button:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
    .tools button:active { transform: scale(.94); }
    .pause-icon { height: 12px; width: 10px; border-inline: 2px solid currentColor; }
    #pause[data-paused="true"] .pause-icon {
      width: 0; height: 0; border: 0; border-left: 9px solid currentColor;
      border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    }
    .replay-icon { position: relative; width: 15px; height: 15px; border: 1.5px solid;
      border-left-color: transparent; border-radius: 50%; transform: rotate(-22deg); }
    .replay-icon::after { content: ""; position: absolute; left: 0; top: -2px; width: 5px;
      height: 5px; border-left: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(12deg); }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; border: 0; }
    noscript { position: absolute; inset: 45% 5% auto; text-align: center; color: white; }
    @media (prefers-reduced-motion: reduce) { .tools { transition: none; } }
  </style>
</head>
<body>
  <main id="stage">
    <h1 class="sr">冰晶回旋</h1>
    <canvas id="art" aria-hidden="true"></canvas>
    <button type="button" id="surface" aria-label="与粒子互动"></button>
    <p id="greeting"></p>
    <div class="tools" role="group" aria-label="播放控制">
      <button type="button" id="replay" aria-label="重播完整演示" title="重播完整演示"><span class="replay-icon" aria-hidden="true"></span></button>
      <button type="button" id="pause" aria-label="暂停动画" title="暂停动画"><span class="pause-icon" aria-hidden="true"></span></button>
    </div>
    <noscript>请用启用了 JavaScript 的浏览器打开这棵树。</noscript>
  </main>
  <script>
    "use strict";
// ── 画布、空间坐标与光点 ──────────────────────────────
// 树脚高度为 0，树尖为 1。横向和纵深坐标以树脚半径为单位。
const TAU = Math.PI * 2;
const clamp = (n, low, high) => Math.min(high, Math.max(low, n));
const mix = (a, b, t) => a + (b - a) * t;
function smooth(low, high, value) {
  const t = clamp((value - low) / (high - low), 0, 1);
  return t * t * (3 - 2 * t);
}
function randomFrom(seed) {
  let state = seed >>> 0;
  return () => {
    state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
    return state / 4294967296;
  };
}
const blend = (a, b, n) => a.map((v, i) => Math.round(mix(v, b[i], n)));
const rgb = (c, a = 1) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
const ivory = [255, 250, 235];
function readColor(hex) {
  const match = /^#?([\da-f]{6})$/i.exec(String(hex).trim());
  const n = parseInt(match ? match[1] : "ffe0b0", 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}

function softLight(ctx, x, y, rx, ry, tint, strength) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  gradient.addColorStop(0, rgb(tint, strength));
  gradient.addColorStop(.38, rgb(tint, strength * .55));
  gradient.addColorStop(1, rgb(tint, 0));
  ctx.fillStyle = gradient;
  ctx.fillRect(-1, -1, 2, 2);
  ctx.restore();
}
function makeGlow(tint) {
  const tile = document.createElement("canvas");
  tile.width = tile.height = 64;
  const c = tile.getContext("2d");
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, rgb(ivory));
  g.addColorStop(.075, rgb(blend(tint, ivory, .72), .98));
  g.addColorStop(.19, rgb(tint, .61));
  g.addColorStop(.43, rgb(tint, .17));
  g.addColorStop(1, rgb(tint, 0));
  c.fillStyle = g;
  c.fillRect(0, 0, 64, 64);
  return tile;
}
// 一枚笔刷包含细尘、晕光和几粒亮晶。同一片枝层叠印后仍有颗粒感。
function makeDustBrushes(accent) {
  const rand = randomFrom(89617);
  return Array.from({ length: 12 }, (_, variant) => {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 64;
    const c = tile.getContext("2d");
    const pale = blend(accent, ivory, .76);
    softLight(c,32,32,30,23,accent,.095 + (variant % 3) * .015);
    for (let i = 0; i < 61; i++) {
      const x = 32 + (rand() + rand() + rand() - 1.5) * 24;
      const y = 32 + (rand() + rand() + rand() - 1.5) * 17;
      const s = .66 + rand() ** 2 * 2.55;
      c.fillStyle = rgb(i % 3 ? accent : pale, .34 + .62 * rand());
      c.fillRect(x, y, s, s);
    }
    c.fillStyle = rgb(pale, .94);
    c.fillRect(31,31,2.45,2.45);
    return tile;
  });
}
function stamp(ctx, tile, x, y, radius) {
  ctx.drawImage(tile, x - radius, y - radius, radius * 2, radius * 2);
}

function makeSpeck(rand) {
  return {
    x: 0, y: 0, z: 0, size: .43 + rand() ** 2 * 1.26, phase: rand() * TAU,
    speed: .8 + rand() * 2.4, tone: Math.floor(rand() * 5),
    bright: .52 + rand() * .48, gem: rand() < .068,
    kick: rand() * 2 - 1,
    brush: Math.floor(rand() * 12), cluster: rand() ** 1.2
  };
}
function project(f, x, y, z, out) {
  const across = x * f.cos + z * f.sin;
  const depth = z * f.cos - x * f.sin;
  out.x = f.cx + across * f.r * (1 + depth * (.055 + f.parallax));
  out.y = f.base - y * f.h + depth * f.r * (.178 + (.5 - y) * .078 + f.pitch);
  out.z = depth;
  return out;
}
const pixel = {};
function drawSpeck(f, p, x, y, z, opacity = 1, grain = 1) {
  if (opacity <= .008) return;
  const q = project(f, x, y, z, pixel);
  const near = clamp(.72 + q.z * .28, .34, 1.15);
  const twinkle = .74 + .26 * Math.sin(f.clock * p.speed + p.phase);
  const side = Math.max(.70, p.size * f.unit * (.89 + near * .34));
  const c = f.ctx;
  const light = clamp(opacity * p.bright * near * (.83 + .26 * twinkle), 0, 1);
  if (f.brushes && p.cluster > .18) {
    c.globalAlpha = Math.min(1, light * (.76 + p.cluster * .24)) * grain;
    const spread = f.unit * (4.7 + 6.9 * p.cluster);
    stamp(c, f.brushes[p.brush], q.x, q.y, spread);
  }
  c.globalAlpha = light;
  c.fillStyle = f.inks[p.tone];
  c.fillRect(q.x - side / 2, q.y - side / 2, side, side);
  if (p.gem && twinkle > .75) {
    c.globalAlpha *= .88;
    stamp(c, f.glow, q.x, q.y, side * (1.65 + twinkle * 2.3));
    if (p.cluster > .69 && twinkle > .89) gleam(c,q.x,q.y,side * 3.6,f.inks[3],light * twinkle,.15);
  }
}

function gleam(c, x, y, radius, tint, alpha = 1, angle = 0) {
  if (alpha < .01 || radius < .2) return;
  c.save();
  c.globalAlpha = clamp(alpha, 0, 1);
  c.translate(x, y);
  c.rotate(angle);
  c.fillStyle = tint;
  c.beginPath();
  c.moveTo(0, -radius);
  const thin = radius * .042;
  c.bezierCurveTo(thin,-thin,thin,-thin,radius * .80,0);
  c.bezierCurveTo(thin,thin,thin,thin,0,radius);
  c.bezierCurveTo(-thin,thin,-thin,thin,-radius * .80,0);
  c.bezierCurveTo(-thin,-thin,-thin,-thin,0,-radius);
  c.fill();
  c.restore();
}
function facetedStar(f, x, y, r, turn, alpha, shades) {
  if (alpha < .012) return;
  const c = f.ctx;
  const stretch = .44 + .56 * Math.abs(Math.cos(turn));
  const ridge = Math.sin(turn) * r * .25;
  const points = [];
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const radius = (i % 2 ? .43 : 1) * r;
    points.push([Math.cos(a) * radius * stretch, Math.sin(a) * radius]);
  }
  c.save();
  c.globalAlpha = alpha;
  stamp(c, f.glow, x, y, r * 2.65);
  c.translate(x, y);
  for (let i = 0; i < 10; i++) {
    const next = points[(i + 1) % 10];
    c.fillStyle = shades[(i + (Math.sin(turn) < 0 ? 2 : 0)) % shades.length];
    c.beginPath();
    c.moveTo(ridge, -r * .05);
    c.lineTo(points[i][0], points[i][1]);
    c.lineTo(next[0], next[1]);
    c.closePath();
    c.fill();
  }
  c.restore();
}

// 一条光带分背面和正面绘制，中间插入树身，旋转时保留前后遮挡。
function makeRibbon(turns, phase, radiusAt, yAt = u => .025 + u * .94) {
  const points = [];
  const steps = Math.ceil(Math.abs(turns) * 72);
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const a = phase + u * turns * TAU;
    const r = radiusAt(u);
    points.push({ x: Math.cos(a) * r, y: yAt(u, a), z: Math.sin(a) * r, u });
  }
  return points;
}
function drawRibbon(f, points, end, front, width, tint, core, strength) {
  if (strength < .01 || end <= 0) return;
  const c = f.ctx;
  const q = {};
  let penDown = false;
  c.beginPath();
  for (const p of points) {
    if (p.u > end) break;
    project(f, p.x, p.y, p.z, q);
    if ((q.z >= 0) !== front) { penDown = false; continue; }
    if (penDown) c.lineTo(q.x, q.y);
    else c.moveTo(q.x, q.y);
    penDown = true;
  }
  c.lineCap = "round";
  c.strokeStyle = tint;
  c.lineWidth = width * f.unit * 4;
  c.globalAlpha = strength * (front ? .12 : .033);
  c.stroke();
  c.lineWidth = Math.max(.48, width * f.unit);
  c.globalAlpha = strength * (front ? .84 : .21);
  c.stroke();
  c.lineWidth = Math.max(.4, width * f.unit * .39);
  c.strokeStyle = core;
  c.globalAlpha = strength * (front ? .87 : .15);
  c.stroke();
  c.globalAlpha = 1;
}

function paintSky(f, scene) {
  const { w, height, cx, base, r, h } = f;
  const tile = document.createElement("canvas");
  const scale = Math.min(f.dpr, 1.45);
  tile.width = Math.ceil(w * scale);
  tile.height = Math.ceil(height * scale);
  const c = tile.getContext("2d", { alpha: false });
  c.scale(tile.width / w, tile.height / height);
  const sky = scene.sky;
  const rand = randomFrom(scene.seed + 23);
  c.fillStyle = sky.base;
  c.fillRect(0, 0, w, height);
  softLight(c, cx, base - h * .46, Math.max(r * 2.65, w * .39), h * 1.02, sky.air, .38);
  softLight(c, cx - r * .67, base - h * .27, r * 1.53, h * .48, sky.air, .20);
  softLight(c, cx + r * .42, base - h * .83, r * 1.8, h * .41, sky.air, .18);
  const stars = Math.round(clamp(w * height / 2650, 78, 560) * sky.stars);
  for (let i = 0; i < stars; i++) {
    const x = rand() * w, y = rand() * height;
    const size = .35 + rand() ** 3 * 1.05;
    c.fillStyle = rgb(i % 5 ? sky.star : ivory, .15 + rand() * .47);
    c.beginPath(); c.arc(x, y, size, 0, TAU); c.fill();
    if (i % 38 === 2) gleam(c, x, y, size * 3.35, rgb(sky.star), .42);
  }
  if (scene.backdrop) scene.backdrop(c, f, rand);
  return tile;
}
// 地面星尘用树脚半径作单位。只生成一次坐标；镜头、自转和拖动都走树身的投影。
function makeGroundArc(start,end) {
  const steps=Math.ceil((end-start)*14);
  return Array.from({length:steps+1},(_,i)=>{
    const a=mix(start,end,i/steps);
    return {x:Math.cos(a),z:Math.sin(a)};
  });
}
function makeGround(scene) {
  const {sky}=scene, rand=randomFrom(scene.seed+193);
  const groups=[sky.star,ivory].flatMap(tint=>
    Array.from({length:6},(_,i)=>({ink:rgb(tint,.13+i*.095),points:[]})));
  const arcs=[], glints=[];
  sky.rings.forEach((radius,i)=>{
    const clusters=Array.from({length:3},()=>rand()*TAU);
    for (const a of clusters) {
      glints.push({x:radius*Math.cos(a),z:radius*Math.sin(a),size:1.2+rand()*.87});
    }
    if (sky.spread<.10) {
      arcs.push({radius,points:makeGroundArc(.1+i*.47,Math.PI*(1.88-i*.06)),
        ink:rgb(sky.star,.12/(1+i*.3))});
    }
    const total=Math.round(220+radius*175);
    for (let j=0;j<total;j++) {
      // 少量密集的星点给每一圈留下可以跟随的亮斑。
      const angle=j%7===0 ? clusters[j%3]+(rand()+rand()-1)*.16 : rand()*TAU;
      const r=radius+(rand()-.5)*sky.spread*(1+i*.15);
      const light=(.12+rand()*.48)*(1-i*.075);
      const index=clamp(Math.round((light-.13)/.095),0,5)+(rand()>.83 ? 6 : 0);
      groups[index].points.push({x:Math.cos(angle)*r,z:Math.sin(angle)*r,
        offset:(rand()-.5)*2.3,size:.48+rand()**2*1.24});
    }
  });
  const haze=document.createElement("canvas");
  haze.width=192; haze.height=48;
  softLight(haze.getContext("2d"),96,24,96,24,sky.air,.40);
  return {groups,arcs,glints,haze,ink:rgb(sky.star)};
}
function groundLevel(f) { return -.085*f.r/f.h; }
function drawGroundArc(f,level,radius,points) {
  const c=f.ctx, q={};
  c.beginPath();
  for (let i=0;i<points.length;i++) {
    const p=points[i];
    project(f,p.x*radius,level,p.z*radius,q);
    if (i) c.lineTo(q.x,q.y); else c.moveTo(q.x,q.y);
  }
  c.stroke();
}
function drawGround(f,yaw=f.yaw) {
  const view=yaw===f.yaw ? f : {...f,cos:Math.cos(yaw),sin:Math.sin(yaw)};
  const c=f.ctx, ground=f.ground, level=groundLevel(f), q={};
  c.save();
  c.globalAlpha=1;
  c.drawImage(ground.haze,f.cx-f.r*1.72,f.base-f.r*.17,f.r*3.44,f.r*.54);
  c.lineWidth=.69*f.unit;
  for (const arc of ground.arcs) {
    c.strokeStyle=arc.ink;
    drawGroundArc(view,level,arc.radius,arc.points);
  }
  for (const group of ground.groups) {
    c.fillStyle=group.ink;
    c.beginPath();
    for (const p of group.points) {
      project(view,p.x,level,p.z,q);
      const size=p.size*f.unit;
      c.rect(q.x-size*.5,q.y+(p.offset-p.size*.37)*f.unit,size,size*.74);
    }
    c.fill();
  }
  for (const p of ground.glints) {
    project(view,p.x,level,p.z,q);
    const size=p.size*f.unit, light=.60+.16*clamp(q.z,-1,1);
    c.globalAlpha=light; stamp(c,f.glow,q.x,q.y,size*2.45);
    gleam(c,q.x,q.y,size*1.85,ground.ink,light,.2);
  }
  c.restore();
}
function makeSnow(rand, count) {
  return Array.from({ length: count }, () => ({
    x: rand(), y: rand(), phase: rand() * TAU, speed: .5 + rand(),
    radius: .48 + rand() ** 3 * 1.85, alpha: .14 + rand() * .38
  }));
}
function snowPosition(f, p, drift, out) {
  out.x = p.x * f.w + Math.sin(f.clock * .22 * p.speed + p.phase) * 10 * f.unit;
  out.y = ((p.y * (f.height + 24) + f.clock * drift * p.speed) % (f.height + 24)) - 12;
  return out;
}
function drawSnow(f, snow, scene) {
  const c = f.ctx, q = {};
  c.fillStyle = rgb(scene.sky.star);
  for (const p of snow) {
    q.lockAlpha=1;
    snowPosition(f,p,scene.drift,q);
    if (p.frozen) holdFlake(f,p,q);
    const {x,y} = q;
    const radius = p.radius * f.unit;
    c.globalAlpha=p.alpha*(.85+.15*Math.sin(p.phase+f.clock*.9))*q.lockAlpha;
    c.beginPath(); c.arc(x, y, radius * .62, 0, TAU); c.fill();
    if (p.radius > 1.91) stamp(c, f.glow, x, y, radius * 2.5);
  }
  c.globalAlpha = 1;
}
// ── 可复用的粒子特效。时间和视角由播放器统一传入。 ──────────
function makeComet(rand, count, tint, highlight) {
  const grains = Array.from({ length: count }, () => ({
    offset: rand(), x: (rand() - .5) * 2, y: (rand() - .5) * 2,
    phase: rand() * TAU, size: .44 + rand() ** 2 * 1.25, hot: rand() > .68
  }));
  return { grains, tint: rgb(tint), core: rgb(highlight), glow: makeGlow(tint) };
}
function projectRibbonAt(f, route, u, out) {
  const index = clamp(u, 0, 1) * (route.length - 1);
  const a = route[Math.floor(index)], b = route[Math.min(route.length - 1, Math.floor(index) + 1)];
  const k = index % 1;
  return project(f, mix(a.x,b.x,k), mix(a.y,b.y,k), mix(a.z,b.z,k), out);
}
// sample(u, out) 返回屏幕位置和纵深。彗核、轨迹和四散的细尘共用同一路径。
function drawComet(f, comet, head, span, sample, intensity) {
  if (intensity < .012) return;
  const c = f.ctx, q = {}, prev = {};
  c.save();
  c.globalCompositeOperation = "lighter";
  c.lineCap = "round";
  sample(head,prev);
  for (let i = 1; i <= 25; i++) {
    const lag = i / 25, u = head - span * lag;
    sample(u,q);
    const near = clamp(.76 + q.z * .38,.24,1);
    c.globalAlpha = intensity * (1 - lag) ** 1.3 * near;
    c.strokeStyle = i < 6 ? comet.core : comet.tint;
    c.lineWidth = f.unit * (.4 + 1.45 * (1 - lag));
    c.beginPath(); c.moveTo(prev.x,prev.y); c.lineTo(q.x,q.y); c.stroke();
    prev.x = q.x; prev.y = q.y;
  }
  for (const p of comet.grains) {
    const lag = (p.offset + f.clock * .29) % 1;
    sample(head - span * lag, q);
    const width = f.unit * (1.6 + 11 * lag ** .8);
    const x = q.x + (p.x + .19 * Math.sin(p.phase + lag * 5)) * width;
    const y = q.y + (p.y + .34 * lag) * width;
    c.globalAlpha = intensity * (.18 + .78 * (1 - lag)) * clamp(.78 + q.z * .38,.25,1);
    c.fillStyle = p.hot ? comet.core : comet.tint;
    const size = p.size * f.unit;
    c.fillRect(x,y,size,size);
  }
  sample(head,q);
  const near = clamp(.78 + q.z * .36,.25,1);
  c.globalAlpha = intensity * near;
  stamp(c,comet.glow,q.x,q.y,14 * f.unit);
  gleam(c,q.x,q.y,8 * f.unit,comet.core,intensity * near,.19);
  c.restore();
}

// 有正反面的飘落物沿不同半径绕树。纹理只生成一次。

    userTurn += delta;
    drag.speed = clamp(mix(drag.speed, delta / seconds, .56), -3.25, 3.25);
    drag.lastX = e.clientX; drag.lastAt = e.timeStamp;
    requestFrame();
  });
  function endDrag(e) {
    if (!drag || drag.id !== e.pointerId) return;
    const tap = e.type === "pointerup" && !drag.moved && !drag.revealOnly && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6;
    skipPointerClick = true;
    const coast = e.type === "pointerup" && drag.moved && e.timeStamp - drag.lastAt < 90 && !paused && !lowMotion.matches;
    velocity = coast ? drag.speed : 0;
    drag = null; surface.classList.remove("is-dragging");
    if (surface.hasPointerCapture(e.pointerId)) surface.releasePointerCapture(e.pointerId);
    // 触摸浏览器在拖动后可能省略下一次合成 click。有效轻点在抬手时兑现。
    if (tap) interact(e.clientX / f.w, e.clientY / f.height);
    requestFrame();
  }
  surface.addEventListener("pointerup", endDrag);
  surface.addEventListener("pointercancel", endDrag);
  surface.addEventListener("lostpointercapture", endDrag);
  stage.addEventListener("pointerdown", () => { skipPointerClick = false; }, true);
  // 有的触屏会把后续 click 发到刚出现的播放按钮。这次轻点已经在抬手时处理。
  stage.addEventListener("click", e => {
    if (!skipPointerClick || e.detail === 0) return;
    skipPointerClick = false; e.preventDefault(); e.stopPropagation();
  }, true);
  surface.addEventListener("click", () => interact());
  surface.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); velocity = 0; demo=null;
    userTurn += e.key === "ArrowLeft" ? -.19 : .19;
    requestFrame();
  });
  stage.addEventListener("pointermove", showControls);
  stage.addEventListener("pointerdown", showControls);
  document.addEventListener("visibilitychange", () => {
    if (frameId) cancelAnimationFrame(frameId);
    frameId = 0; previous = null;
    if (!document.hidden) requestFrame();
  });
  lowMotion.addEventListener("change", () => {
    paused=lowMotion.matches; previous=null; velocity=0;
    if (paused) {
      shot=1; settle=null; demo=null; feedback=[];
      for (const p of snow) p.frozen=null;
      if (scene.still) scene.still();
      else scene.reset();
    }
    updatePauseButton(); requestFrame();
  });
  window.addEventListener("resize", resize);
  updatePauseButton(); resize();
}
startPlayer();
  </script>
</body>
